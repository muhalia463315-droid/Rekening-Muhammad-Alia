<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grab Driver QR Code & Rekening - Modern Neon</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(18, 24, 38, 0.85);
            --border-glow: #00ff88;
            --neon-green: #00ff88;
            --neon-cyan: #00e5ff;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            
            /* Brand Colors Neon Variant */
            --seabank-orange: #ff6b35;
            --cimb-red: #ff2a4b;
            --ovo-purple: #a855f7;
            --dana-blue: #00a2ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 255, 136, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 229, 255, 0.15) 0%, transparent 40%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-main);
        }

        /* CARD MAIN CONTAINER WITH NEON BORDER */
        .qr-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 380px;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.2),
                0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .qr-card:hover {
            border-color: rgba(0, 255, 136, 0.6);
            box-shadow: 
                0 0 30px rgba(0, 255, 136, 0.35),
                0 20px 40px rgba(0, 0, 0, 0.8);
        }

        /* HEADER NEON */
        .card-header {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1) 0%, rgba(0, 229, 255, 0.05) 100%);
            padding: 20px 18px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .profile-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .driver-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff88, #00e5ff);
            color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 800;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
            border: 2px solid #ffffff;
            flex-shrink: 0;
        }

        .driver-name {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .service-type {
            font-size: 0.72rem;
            color: var(--neon-green);
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* KONTEN UTAMA */
        .card-content {
            padding: 20px;
        }

        /* TAB NAVIGATION METHOD */
        .method-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 18px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--neon-green);
            color: #0b0f19;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
        }

        /* QR SECTION WITH GLOW BORDER */
        .qr-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .qris-text {
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #fff;
        }

        .qris-sub {
            font-size: 0.65rem;
            color: var(--text-sub);
            display: block;
            font-weight: 500;
        }

        .gpn-badge {
            background: #e11d48;
            color: white;
            font-weight: 900;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(225, 29, 72, 0.5);
        }

        /* PERBAIKAN FORM KOTAK QR CODE */
        .qr-wrapper {
            background: #ffffff;
            padding: 6px;
            border-radius: 20px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.3);
            border: 2px solid var(--neon-cyan);
            width: 250px;
            height: 250px;
            overflow: hidden;
        }

        .qr-image {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transform: scale(1.15);
            border-radius: 14px;
        }

        /* BANK LIST */
        .bank-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bank-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .bank-box:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }

        .bank-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bank-logo-wrapper {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            flex-shrink: 0;
        }

        .bank-logo-svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .bank-info {
            display: flex;
            flex-direction: column;
        }

        .bank-title {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .account-number {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin-top: 2px;
            font-family: 'Courier New', Courier, monospace;
        }

        .account-holder {
            font-size: 0.68rem;
            color: var(--text-sub);
        }

        /* NEON COPY BUTTONS */
        .copy-btn {
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Specific Neon Styles */
        .seabank-box { border-color: rgba(255, 107, 53, 0.3); }
        .seabank-box .bank-title { color: var(--seabank-orange); }
        .seabank-box:hover { box-shadow: 0 0 15px rgba(255, 107, 53, 0.2); }
        .seabank-btn { background: var(--seabank-orange); box-shadow: 0 0 10px rgba(255, 107, 53, 0.4); }

        .cimb-box { border-color: rgba(255, 42, 75, 0.3); }
        .cimb-box .bank-title { color: var(--cimb-red); }
        .cimb-box:hover { box-shadow: 0 0 15px rgba(255, 42, 75, 0.2); }
        .cimb-btn { background: var(--cimb-red); box-shadow: 0 0 10px rgba(255, 42, 75, 0.4); }

        .ovo-box { border-color: rgba(168, 85, 247, 0.3); }
        .ovo-box .bank-title { color: var(--ovo-purple); }
        .ovo-box:hover { box-shadow: 0 0 15px rgba(168, 85, 247, 0.2); }
        .ovo-btn { background: var(--ovo-purple); box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }

        .dana-box { border-color: rgba(0, 162, 255, 0.3); }
        .dana-box .bank-title { color: var(--dana-blue); }
        .dana-box:hover { box-shadow: 0 0 15px rgba(0, 162, 255, 0.2); }
        .dana-btn { background: var(--dana-blue); box-shadow: 0 0 10px rgba(0, 162, 255, 0.4); }

        .copy-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        /* FOOTER */
        .card-footer {
            padding: 0 20px 20px;
        }

        .action-button {
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            border: none;
            color: #0b0f19;
            padding: 14px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-button:hover {
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.7);
            transform: translateY(-2px);
        }

        /* TOAST NOTIFICATION */
        .toast-container {
            position: fixed;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 24, 38, 0.95);
            border: 1px solid var(--neon-green);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 9999;
        }

        .toast-container.show {
            bottom: 30px;
        }

        .toast-icon {
            color: var(--neon-green);
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="qr-card">
        
        <!-- Header -->
        <div class="card-header">
            <div class="profile-container">
                <div class="driver-avatar">MA</div>
                <div class="driver-text">
                    <div class="driver-name">Muhammad Alia</div>
                    <div class="service-type">Grab Driver Partner</div>
                </div>
            </div>
        </div>

        <!-- Konten Utama -->
        <div class="card-content">
            
            <!-- Tab Filter Metode Pembayaran -->
            <div class="method-tabs">
                <button class="tab-btn active" onclick="switchTab('all')">Semua Opsi</button>
                <button class="tab-btn" onclick="switchTab('qris')">QRIS Code</button>
                <button class="tab-btn" onclick="switchTab('transfer')">Transfer Bank</button>
            </div>

            <!-- Tampilan QRIS -->
            <div class="qr-section" id="qris-block">
                <div class="logo-row">
                    <div class="qris-text">
                        QRIS
                        <span class="qris-sub">Standar Pembayaran Nasional</span>
                    </div>
                    <div class="gpn-badge">GPN</div>
                </div>

                <div class="qr-wrapper">
                    <img src="QR Dana.jpeg" alt="QR DANA Muhammad Alia" class="qr-image">
                </div>
            </div>

            <!-- Daftar Bank & E-Wallet -->
            <div class="bank-list" id="bank-block">
                
                <!-- SeaBank -->
                <div class="bank-box seabank-box">
                    <div class="bank-details">
                        <div class="bank-logo-wrapper">
                            <svg class="bank-logo-svg" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="45" fill="#FF6B35"/>
                                <text x="50" y="68" font-family="Arial" font-weight="900" font-size="55" fill="#FFFFFF" text-anchor="middle">S</text>
                            </svg>
                        </div>
                        <div class="bank-info">
                            <span class="bank-title">SeaBank</span>
                            <span class="account-number" id="acc-seabank">901213088280</span>
                            <span class="account-holder">a/n Muhammad Alia</span>
                        </div>
                    </div>
                    <button class="copy-btn seabank-btn" onclick="copyAccount('acc-seabank', 'SeaBank')">Salin</button>
                </div>

                <!-- CIMB Niaga -->
                <div class="bank-box cimb-box">
                    <div class="bank-details">
                        <div class="bank-logo-wrapper">
                            <svg class="bank-logo-svg" viewBox="0 0 100 100">
                                <rect width="100" height="100" rx="20" fill="#780000"/>
                                <polygon points="20,20 80,20 80,50" fill="#FFFFFF"/>
                                <polygon points="20,50 80,50 80,80" fill="#FF2A4B"/>
                            </svg>
                        </div>
                        <div class="bank-info">
                            <span class="bank-title">CIMB Niaga</span>
                            <span class="account-number" id="acc-cimb">704992338000</span>
                            <span class="account-holder">a/n Muhammad Alia</span>
                        </div>
                    </div>
                    <button class="copy-btn cimb-btn" onclick="copyAccount('acc-cimb', 'CIMB Niaga')">Salin</button>
                </div>

                <!-- OVO -->
                <div class="bank-box ovo-box">
                    <div class="bank-details">
                        <div class="bank-logo-wrapper">
                            <svg class="bank-logo-svg" viewBox="0 0 100 100">
                                <rect width="100" height="100" rx="20" fill="#4C2A86"/>
                                <text x="50" y="65" font-family="Arial" font-weight="900" font-size="36" fill="#A855F7" text-anchor="middle">OVO</text>
                            </svg>
                        </div>
                        <div class="bank-info">
                            <span class="bank-title">OVO</span>
                            <span class="account-number" id="acc-ovo">085141347197</span>
                            <span class="account-holder">a/n Muhammad Alia</span>
                        </div>
                    </div>
                    <button class="copy-btn ovo-btn" onclick="copyAccount('acc-ovo', 'OVO')">Salin</button>
                </div>

                <!-- DANA -->
                <div class="bank-box dana-box">
                    <div class="bank-details">
                        <div class="bank-logo-wrapper">
                            <svg class="bank-logo-svg" viewBox="0 0 100 100">
                                <rect width="100" height="100" rx="20" fill="#118EEA"/>
                                <text x="50" y="62" font-family="Arial" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle">DANA</text>
                            </svg>
                        </div>
                        <div class="bank-info">
                            <span class="bank-title">DANA</span>
                            <span class="account-number" id="acc-dana">085141347197</span>
                            <span class="account-holder">a/n Muhammad Alia</span>
                        </div>
                    </div>
                    <button class="copy-btn dana-btn" onclick="copyAccount('acc-dana', 'DANA')">Salin</button>
                </div>

            </div>

        </div>

        <!-- Footer -->
        <div class="card-footer">
            <button class="action-button" onclick="shareCard()">Bagikan Info Pembayaran</button>
        </div>

    </div>

    <!-- TOAST NOTIFIKASI -->
    <div id="toast" class="toast-container">
        <span class="toast-icon">✓</span>
        <span id="toast-message">Nomor rekening berhasil disalin!</span>
    </div>

    <script>
        let toastTimeout;

        function copyAccount(elementId, bankName) {
            const accNum = document.getElementById(elementId).innerText;
            
            navigator.clipboard.writeText(accNum).then(() => {
                showToast(`Nomor ${bankName} (${accNum}) disalin!`);
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');

            toastMsg.innerText = message;
            toast.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function switchTab(type) {
            const buttons = document.querySelectorAll('.tab-btn');
            const qrisBlock = document.getElementById('qris-block');
            const bankBlock = document.getElementById('bank-block');

            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (type === 'qris') {
                qrisBlock.style.display = 'block';
                bankBlock.style.display = 'none';
            } else if (type === 'transfer') {
                qrisBlock.style.display = 'none';
                bankBlock.style.display = 'flex';
            } else {
                qrisBlock.style.display = 'block';
                bankBlock.style.display = 'flex';
            }
        }

        async function shareCard() {
            const shareText = `Pembayaran Grab Driver Muhammad Alia:\n\n` +
                              `• SeaBank: 901213088280\n` +
                              `• CIMB Niaga: 704992338000\n` +
                              `• OVO: 085141347197\n` +
                              `• DANA: 085141347197\n\n` +
                              `a/n Muhammad Alia\n` +
                              `${window.location.href}`;

            try {
                if (navigator.share) {
                    await navigator.share({
                        title: 'Pembayaran Grab Driver',
                        text: shareText
                    });
                } else {
                    await navigator.clipboard.writeText(shareText);
                    showToast('Teks pembayaran disalin ke clipboard!');
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    showToast('Gagal membagikan tampilan.');
                }
            }
        }
    </script>

</body>
</html>
